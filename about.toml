# Configuration for cargo-about (https://embarkstudios.github.io/cargo-about/).
# Generates THIRD-PARTY-LICENSES.txt from the dependency lockfile:
#
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
#
# `accepted` lists the SPDX license identifiers we allow third-party
# dependencies to use. If `cargo about generate` reports an unmatched or
# unexpected license, review that dependency and, if its license is
# acceptable, add the identifier here.
#
# NOTE: All bare (top-level) keys must appear before any [table] header below.

# Only consider licenses relevant to the platforms we actually ship.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Build/dev dependencies are not distributed in the binary, so their notices
# do not need to ship alongside it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Treat a crate offering multiple licenses as satisfied when at least one of
# its licenses is in `accepted`. Font licenses (OFL-1.1, Ubuntu-font-1.0) are
# required by epaint's bundled default fonts and must ship with the binary.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Unlicense",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Skip first-party workspace crates (Foxy, foxy-server-backend-cli). They are covered
# by LICENSE (the Foxy Community Source License), not by this third-party file.
# They are marked `publish = false`, which makes them "private" here.
[private]
ignore = true

# cfg_block ships its license only as a LICENSE file with no SPDX expression in
# its manifest. The file is the standard Apache-2.0 notice; map it explicitly so
# cargo-about can classify it. The checksum guards against the file changing.
[cfg_block.clarify]
license = "Apache-2.0"
[[cfg_block.clarify.files]]
path = "LICENSE"
checksum = "408bbc4d10bdf74d8c9b74b64ea4910603257e24133da18edc4d16198e3b4010"
