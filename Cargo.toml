[workspace]
members = [".", "foxy-formats", "foxy-sol", "foxy-server-backend-cli", "testkit/mutator", "testkit/runner", "testkit/oracle"]

[package]
name = "Foxy"
version = "1.2.0"
edition = "2024"
rust-version = "1.96"
build = "build.rs"
# Application crate under the Foxy Community Source License (see LICENSE), not
# an open-source library; never published to a public registry.
publish = false
license-file = "LICENSE"

[profile.dev]
# Line-tables-only debuginfo: keeps usable backtraces while cutting the
# debuginfo codegen + link cost that dominates incremental rebuilds.
debug = "line-tables-only"

# Turso runs every statement through interpreted VDBE + B-tree code in
# turso_core; at opt-level 0 the clean-DB bootstrap insert of 433k subfile rows
# measured ~15x slower than release (127s vs ~9s), so dev-build logs kept
# looking like a DB regression that release builds do not have
# (recheck_clean_db_regression_2026-07-05.md). Optimize the Turso stack in dev
# so DB timings are representative; the workspace crate stays unoptimized for
# fast iteration. Proc-macro crates (turso_macros, turso_sdk_kit_macros) are
# compile-time only and intentionally left out.
[profile.dev.package.turso]
opt-level = 3
[profile.dev.package.turso_core]
opt-level = 3
[profile.dev.package.turso_ext]
opt-level = 3
[profile.dev.package.turso_parser]
opt-level = 3
[profile.dev.package.turso_sdk_kit]
opt-level = 3
[profile.dev.package.turso_sync_sdk_kit]
opt-level = 3
[profile.dev.package.turso_sync_engine]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"


[features]
default = ["flate2/default"]
zlib-ng = ["flate2/zlib-ng"]
# Marks a release build as a pre-release: release-optimized, but the version
# label and logs still carry the source commit. Build with `cargo prerelease`.
prerelease = []

[dependencies]
flexi_logger = { version = "0.31.10", features = ["async", "colors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toon-format = { version = "0.7.0", default-features = false }
scraper = "0.29.0"
egui = { version = "0.37.0", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37.0", features = ["glow", "inspection"] }
rfd = "0.17.2"
tokio = { version = "1.54.1", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "io-util", "fs"] }
flate2 = { version = "1.1.10" , default-features = false}
log = "0.4.34"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "blocking", "stream", "gzip", "brotli", "deflate"] }
image = "0.25.10"
dirs = "7.0.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
tokio-util = "0.7.20"
anyhow = "1.0.104"
chrono = "0.4.45"
ansi_term = "0.12.1"
rand = "0.10.3"
md-5 = "0.11.0"
blake3 = { version = "1.8.7", features = ["mmap"] }
mimalloc = { version = "0.1.52", default-features = false }
once_cell = "1.21.4"
notify = "8.2.1"
clap = { version = "4.6.7", features = ["derive"] }
sys-locale = "0.3.2"
icu_collator = { version = "2.4.0", features = ["compiled_data"] }
icu_locale_core = "2.4.0"
# Enable Wayland data-control clipboard support while keeping X11 support on Linux.
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
semver = "1.0.28"
# Turso is used as a local-file persistence engine. Remote sync is intentionally
# off; default features stay off to avoid unused FTS support and a process-wide
# allocator override.
turso = { version = "=0.8.3", default-features = false }
fs4 = "1.1.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
sysinfo = "0.39.6"
jmespath = "0.5.0"
steamworks = "0.13.1"
foxy-formats = { path = "foxy-formats" }
foxy-sol = { path = "foxy-sol" }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "errhandlingapi", "fileapi", "handleapi", "heapapi", "ioapiset", "libloaderapi", "memoryapi", "powersetting", "powrprof", "processthreadsapi", "psapi", "securitybaseapi", "shellapi", "synchapi", "sysinfoapi", "tlhelp32", "winbase", "wincon", "winerror", "winioctl", "winnls", "winnt", "winuser"] }
wmi = "0.18.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
