[package]
name = "foxy-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
foxy-sol = { path = "../../foxy-sol" }
http-body-util = "0.1"
hyper = { version = "1.9", features = ["server", "http1"] }
md-5 = "0.11"
turso = { version = "0.7.2", default-features = false }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
sha2 = "0.11"
sysinfo = "0.39"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
