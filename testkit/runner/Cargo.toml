[package]
name = "foxy-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
foxy-sol = { path = "../../foxy-sol" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
md-5 = "0.11.0"
turso = { version = "=0.8.3", default-features = false }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "stream"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_jcs = "0.2.0"
sha2 = "0.11.1"
sysinfo = "0.39.6"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
