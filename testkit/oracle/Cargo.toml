[package]
name = "foxy-testkit-oracle"
version = "1.2.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "../../LICENSE"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
