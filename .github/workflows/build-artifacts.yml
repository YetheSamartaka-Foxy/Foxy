name: Build Artifacts

run-name: Build artifacts for ${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build (optional)"
        required: false
        type: string
      target_os:
        description: "Client app artifacts to build"
        required: true
        default: none
        type: choice
        options:
          - none
          - windows
          - linux
          - both
      build_server_backend_cli:
        description: "Also build foxy-server-backend-cli artifacts for Windows and Linux"
        required: true
        default: false
        type: boolean
      build_installers:
        description: "Build platform installers"
        required: true
        default: true
        type: boolean
      run_test_lint:
        description: "Run Test & Lint phase"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    if: ${{ inputs.run_test_lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  build-windows:
    name: Windows Artifact
    needs: test
    if: ${{ always() && (inputs.target_os == 'windows' || inputs.target_os == 'both' || inputs.build_installers) && (!inputs.run_test_lint || needs.test.result == 'success') }}
    runs-on: windows-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Capture commit metadata
        id: vars
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "short_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building commit $sha"

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      # steamworks-sys unpacks the redistributable into its own OUT_DIR only.
      # The Workshop helper needs it beside the exe, and the installer packages
      # from this directory, so stage it explicitly rather than relying on
      # build-script ordering.
      - name: Stage Steamworks redistributable
        shell: pwsh
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          $dll = Get-ChildItem -Path "$release/build" -Recurse -Filter steam_api64.dll -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $dll) { throw "steam_api64.dll not found under $release/build" }
          Copy-Item $dll.FullName "$release/steam_api64.dll" -Force
          Write-Host "Staged $($dll.FullName)"

      - name: Verify the packaged executable starts
        shell: pwsh
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          & "$release/Foxy.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Foxy.exe failed to start (exit $LASTEXITCODE)" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: Foxy-windows-${{ steps.vars.outputs.short_sha }}
          path: |
            target/x86_64-pc-windows-msvc/release/Foxy.exe
            target/x86_64-pc-windows-msvc/release/steam_api64.dll
          if-no-files-found: error
          retention-days: 30

      - name: Read version from Cargo.toml
        if: ${{ inputs.build_installers }}
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "App version: $ver"

      - name: Install Inno Setup
        if: ${{ inputs.build_installers }}
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: ${{ inputs.build_installers }}
        shell: pwsh
        run: |
          mkdir -p dist
          iscc /DAppVersion="${{ steps.version.outputs.app_version }}" `
               /DSourceDir="..\..\target\x86_64-pc-windows-msvc\release" `
               installer/windows/foxy-setup.iss

      - name: Upload Windows installer
        if: ${{ inputs.build_installers }}
        uses: actions/upload-artifact@v6
        with:
          name: Foxy-installer-windows-${{ steps.vars.outputs.short_sha }}
          path: dist/Foxy-*-setup.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux Artifact
    needs: test
    if: ${{ always() && (inputs.target_os == 'linux' || inputs.target_os == 'both' || inputs.build_installers) && (!inputs.run_test_lint || needs.test.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Capture commit metadata
        id: vars
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building commit $SHA"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Linux release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # The binary has a DT_NEEDED on libsteam_api.so and is built with an
      # $ORIGIN rpath, so the library must sit beside it or the app will not
      # start. There is no delay-load equivalent on Linux.
      - name: Prepare Linux artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/Foxy dist/Foxy
          chmod +x dist/Foxy
          SO=$(find target/x86_64-unknown-linux-gnu/release/build -name libsteam_api.so | head -n 1)
          if [ -z "$SO" ]; then
            echo "libsteam_api.so not found under the release build directory"
            exit 1
          fi
          cp "$SO" dist/libsteam_api.so
          echo "Staged $SO"

      - name: Verify the packaged binary starts
        run: |
          cd dist
          ./Foxy version

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: Foxy-linux-${{ steps.vars.outputs.short_sha }}
          path: |
            dist/Foxy
            dist/libsteam_api.so
          if-no-files-found: error
          retention-days: 30

      - name: Read version from Cargo.toml
        if: ${{ inputs.build_installers }}
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "App version: $VER"

      - name: Build Linux installer
        if: ${{ inputs.build_installers }}
        run: |
          chmod +x installer/linux/build-installer.sh
          installer/linux/build-installer.sh \
            target/x86_64-unknown-linux-gnu/release/Foxy \
            src/ui/icons/foxy_256.png \
            dist/Foxy-${{ steps.version.outputs.app_version }}-linux-x86_64-installer.sh \
            ${{ steps.version.outputs.app_version }}

      - name: Upload Linux installer
        if: ${{ inputs.build_installers }}
        uses: actions/upload-artifact@v6
        with:
          name: Foxy-installer-linux-${{ steps.vars.outputs.short_sha }}
          path: dist/Foxy-*-linux-*-installer.sh
          if-no-files-found: error
          retention-days: 30

  build-server-backend-cli-windows:
    name: Server CLI Windows Artifact
    needs: test
    if: ${{ always() && inputs.build_server_backend_cli && (!inputs.run_test_lint || needs.test.result == 'success') }}
    runs-on: windows-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Capture commit metadata
        id: vars
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "short_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building commit $sha"

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build server-backend-cli Windows release
        shell: pwsh
        run: cargo build --release --package foxy-server-backend-cli --target x86_64-pc-windows-msvc

      - name: Upload server-backend-cli Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: foxy-server-backend-cli-windows-${{ steps.vars.outputs.short_sha }}
          path: target/x86_64-pc-windows-msvc/release/foxy-server-backend-cli.exe
          if-no-files-found: error
          retention-days: 30

  build-server-backend-cli-linux:
    name: Server CLI Linux Artifact
    needs: test
    if: ${{ always() && inputs.build_server_backend_cli && (!inputs.run_test_lint || needs.test.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Capture commit metadata
        id: vars
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building commit $SHA"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build server-backend-cli Linux release
        run: cargo build --release --package foxy-server-backend-cli --target x86_64-unknown-linux-gnu

      - name: Prepare server-backend-cli Linux artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/foxy-server-backend-cli dist/foxy-server-backend-cli
          chmod +x dist/foxy-server-backend-cli

      - name: Upload server-backend-cli Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: foxy-server-backend-cli-linux-${{ steps.vars.outputs.short_sha }}
          path: dist/foxy-server-backend-cli
          if-no-files-found: error
          retention-days: 30
