name: DCO

# Enforces the Foxy Contributor License Agreement (CLA.md) sign-off requirement.
# Every commit in a pull request must carry a valid `Signed-off-by` trailer
# (added by `git commit -s`). Make this a required status check in branch
# protection so pull requests cannot be merged until it passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  dco-check:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request commits
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          range="${BASE_SHA}..${HEAD_SHA}"
          commits="$(git rev-list --no-merges "$range")"

          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          while IFS= read -r sha; do
            short="$(git log -1 --format='%h' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"
            author_name="$(git log -1 --format='%an' "$sha")"
            author_email="$(git log -1 --format='%ae' "$sha")"

            # Collect all Signed-off-by trailers on this commit.
            signoffs="$(git log -1 --format='%B' "$sha" \
              | grep -iE '^Signed-off-by: .+ <.+@.+>' || true)"

            if [ -z "$signoffs" ]; then
              echo "::error::Commit ${short} (\"${subject}\") is missing a Signed-off-by line."
              failed=1
              continue
            fi

            expected="Signed-off-by: ${author_name} <${author_email}>"
            if ! printf '%s\n' "$signoffs" | grep -qiF "$expected"; then
              echo "::error::Commit ${short} (\"${subject}\") has a Signed-off-by, but none matches the author ${author_name} <${author_email}>."
              echo "         Found:"
              printf '%s\n' "$signoffs" | sed 's/^/           /'
              failed=1
              continue
            fi

            echo "OK: ${short} signed off by ${author_name} <${author_email}>"
          done <<< "$commits"

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more commits are not signed off under the Developer Certificate of Origin."
            echo "Fix the latest commit with:    git commit --amend -s && git push --force-with-lease"
            echo "Fix a range of commits with:   git rebase --signoff <base> && git push --force-with-lease"
            echo "See CLA.md and CONTRIBUTING.md for details."
            exit 1
          fi

          echo "All commits are signed off. CLA sign-off satisfied."
