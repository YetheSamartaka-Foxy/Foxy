[package]
name = "foxy-steam"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "../LICENSE"

[dependencies]
steamroom-client = "=0.3.0"
steamroom = "=0.3.0"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.8"
rand = "0.10.3"
prost = "0.14"
tempfile = "3.27.0"
blake3 = "1.8.7"
sha1 = "0.11"
fs4 = "1.1.0"
foxy-supervisor = { path = "../foxy-supervisor" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
